<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,follow" />
    <title>Form registration</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thank-you/" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="landing_page" />
      <input name="source_url" />
      <input name="referrer" />
      <input name="utm_source" />
      <input name="utm_medium" />
      <input name="utm_campaign" />
      <input name="utm_content" />
      <input name="utm_term" />
      <input name="name" />
      <input name="businessName" />
      <input name="email" />
      <input name="phone" />
      <input name="websiteUrl" />
      <input name="industry" />
      <input name="serviceArea" />
      <select name="planInterest">
        <option>Not sure yet</option>
        <option>Lite</option>
        <option>Starter</option>
        <option>Growth</option>
        <option>Leader</option>
      </select>
      <select name="googleAdsInterest">
        <option>No</option>
        <option>Yes</option>
        <option>Not sure yet</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
